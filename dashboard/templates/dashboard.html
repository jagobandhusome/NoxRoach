<!DOCTYPE html>
<html>
<head>
    <title>Keylogger Analysis Dashboard</title>
    <meta charset="utf-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0e27;
            color: #e0e0e0;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: linear-gradient(135deg, #1a1a3e, #0a0e27);
            border-radius: 15px;
            padding: 20px 30px;
            margin-bottom: 20px;
            border: 1px solid #2a2a5e;
        }
        
        .header h1 {
            font-size: 28px;
            background: linear-gradient(90deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
        }
        
        .status.active {
            background: #00ff00;
            color: #000;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: #1a1a3e;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #2a2a5e;
            text-align: center;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .stat-value.high { color: #ff4444; }
        .stat-value.medium { color: #ffaa00; }
        .stat-value.low { color: #44ff44; }
        
        .main-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .panel {
            background: #1a1a3e;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #2a2a5e;
        }
        
        .panel h3 {
            margin-bottom: 15px;
            color: #888;
            font-weight: 300;
            letter-spacing: 1px;
        }
        
        #keystroke-list {
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        
        #keystroke-list .entry {
            padding: 4px 10px;
            border-bottom: 1px solid #0a0e27;
            display: flex;
            justify-content: space-between;
        }
        
        #keystroke-list .entry .time {
            color: #666;
        }
        
        #keystroke-list .entry .key {
            color: #00d4ff;
        }
        
        #keystroke-list .entry .risk {
            font-weight: bold;
        }
        
        #keystroke-list .entry .risk.low { color: #44ff44; }
        #keystroke-list .entry .risk.medium { color: #ffaa00; }
        #keystroke-list .entry .risk.high { color: #ff4444; }
        
        #threat-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        #threat-list .entry {
            padding: 8px 12px;
            border-bottom: 1px solid #0a0e27;
            margin-bottom: 5px;
            border-radius: 5px;
        }
        
        #threat-list .entry.high {
            background: rgba(255, 68, 68, 0.1);
            border-left: 3px solid #ff4444;
        }
        
        #threat-list .entry.medium {
            background: rgba(255, 170, 0, 0.1);
            border-left: 3px solid #ffaa00;
        }
        
        #threat-list .entry.low {
            background: rgba(68, 255, 68, 0.1);
            border-left: 3px solid #44ff44;
        }
        
        .scrollable {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .scrollable::-webkit-scrollbar {
            width: 6px;
        }
        
        .scrollable::-webkit-scrollbar-track {
            background: #0a0e27;
        }
        
        .scrollable::-webkit-scrollbar-thumb {
            background: #2a2a5e;
            border-radius: 3px;
        }
        
        .live-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #00ff00;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        
        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h1>🔐 Keylogger Analysis Dashboard</h1>
                <div>
                    <span class="live-indicator"></span>
                    <span class="status active">LIVE</span>
                </div>
            </div>
            <div style="margin-top: 10px; font-size: 14px; color: #666;">
                Session: <span id="session-id">Loading...</span>
            </div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="total-keys">0</div>
                <div class="stat-label">Total Keystrokes</div>
            </div>
            <div class="stat-card">
                <div class="stat-value low" id="risk-level">LOW</div>
                <div class="stat-label">Risk Level</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="threat-count">0</div>
                <div class="stat-label">Threats Detected</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="typing-speed">0</div>
                <div class="stat-label">Typing Speed (CPM)</div>
            </div>
        </div>
        
        <div class="main-grid">
            <div class="panel">
                <h3>📝 Recent Keystrokes</h3>
                <div id="keystroke-list" class="scrollable"></div>
            </div>
            <div class="panel">
                <h3>⚠️ Threats Detected</h3>
                <div id="threat-list" class="scrollable"></div>
            </div>
        </div>
    </div>
    
    <script>
        // Dashboard state
        let lastUpdate = 0;
        
        // Update function
        function updateDashboard() {
            fetch('/api/data')
                .then(response => response.json())
                .then(data => {
                    // Update stats
                    document.getElementById('total-keys').textContent = data.stats.total_keystrokes;
                    document.getElementById('threat-count').textContent = data.stats.threats_detected;
                    
                    // Update risk level
                    const riskElement = document.getElementById('risk-level');
                    const riskLevel = data.stats.risk_level;
                    riskElement.textContent = riskLevel;
                    riskElement.className = 'stat-value ' + riskLevel.toLowerCase();
                    
                    // Update keystroke list
                    const keystrokeList = document.getElementById('keystroke-list');
                    const keystrokes = data.keystrokes.slice(-20).reverse();
                    keystrokeList.innerHTML = keystrokes.map(k => `
                        <div class="entry">
                            <span class="time">${k.timestamp ? k.timestamp.split('T')[1].split('.')[0] : ''}</span>
                            <span class="key">${k.key || ''}</span>
                            <span class="risk low">Low</span>
                        </div>
                    `).join('');
                    
                    // Update threat list
                    const threatList = document.getElementById('threat-list');
                    const threats = data.threats.slice(-10).reverse();
                    threatList.innerHTML = threats.map(t => `
                        <div class="entry ${t.severity ? t.severity.toLowerCase() : 'low'}">
                            <strong>${t.type || 'Unknown'}</strong>
                            <div style="font-size: 12px; color: #888; margin-top: 3px;">
                                ${t.matched || ''} - ${t.timestamp || ''}
                            </div>
                        </div>
                    `).join('');
                    
                    // Update typing speed (simple calculation)
                    if (keystrokes.length > 1) {
                        // Simplified speed calculation
                        const speed = Math.min(keystrokes.length * 3, 120);
                        document.getElementById('typing-speed').textContent = speed;
                    }
                    
                    // Update session ID
                    document.getElementById('session-id').textContent = data.session_id || 'N/A';
                })
                .catch(error => console.error('Error fetching data:', error));
        }
        
        // Update every 2 seconds
        setInterval(updateDashboard, 2000);
        
        // Initial update
        updateDashboard();
    </script>
</body>
</html>
